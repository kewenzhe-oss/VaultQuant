version: '3.8'

services:
  vaultquant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultquant
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/local.db
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_MODEL=${AI_MODEL}
    volumes:
      - ./data:/app/data
